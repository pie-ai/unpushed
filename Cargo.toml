[package]
name = "unpushed"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
description = "Overview of unpushed commits across many git checkouts"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pie-ai/unpushed"
readme = "README.md"
keywords = ["git", "tui", "cli", "monorepo"]
categories = ["command-line-utilities", "development-tools"]
# Published so `cargo install unpushed` works. The library target comes along
# for the ride; see the note at the top of src/lib.rs — it carries no stability
# promise.
# Everything the binary needs at build time, nothing else: no release
# tarballs, no CI config, no packaging templates.
include = [
    "src/**/*.rs",
    "build.rs",
    "Cargo.toml",
    "Cargo.lock",
    "/README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "THIRD-PARTY-LICENSES.md",
]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# Read-only access only. Fetch and push are run as `git` subprocesses, so the
# network features (ssh, https) of libgit2 are deliberately disabled.
# libgit2 itself is compiled in and linked statically, so the binary carries no
# system dependency on it — Debian releases ship incompatible libgit2 versions.
# This is permitted by libgit2's GPLv2 linking exception; see
# THIRD-PARTY-LICENSES.md.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
ratatui = "0.30.2"

[build-dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"

[profile.release]
strip = true
lto = true

[package.metadata.deb]
# GitHub's noreply address on purpose: a Debian package is public, and the
# maintainer field is not the place for a work address.
maintainer = "pie-ai <pie-ai@users.noreply.github.com>"
copyright = "2026, unpushed contributors. Licensed under MIT or Apache-2.0."
section = "utils"
priority = "optional"
# The binary is statically linked, so dpkg-shlibdeps finds nothing to depend on
# and the automatic resolution has to be switched off.
depends = ""
recommends = "gitui"
extended-description = """\
Shows every git checkout one level below a directory in a terminal interface, \
with its unpushed commits and local changes, and lets you push from the list."""
assets = [
    ["target/release/unpushed", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/unpushed/README.md", "644"],
    ["THIRD-PARTY-LICENSES.md", "usr/share/doc/unpushed/", "644"],
    ["LICENSE-MIT", "usr/share/doc/unpushed/", "644"],
    ["LICENSE-APACHE", "usr/share/doc/unpushed/", "644"],
    ["man/unpushed.1", "usr/share/man/man1/", "644"],
    ["completions/unpushed.bash", "usr/share/bash-completion/completions/unpushed", "644"],
    ["completions/_unpushed", "usr/share/zsh/vendor-completions/", "644"],
    ["completions/unpushed.fish", "usr/share/fish/vendor_completions.d/", "644"],
]
