name: Feature request
description: Suggest something unpushed should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve
      description: >
        Describe the situation you are in, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: >
            This serves the question "what have I not pushed across these
            checkouts?" rather than something GitUI already does well on a
            single repository.
