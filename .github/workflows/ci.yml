name: CI

on:
  push:
    branches: [main]
  pull_request:

# No scheduled runs on purpose: dependency drift is handled by hand, see
# .github/dependabot.yml.

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      # The scan and push tests create real repositories, including a local
      # bare remote, so nothing here touches the network.
      - run: cargo test

  # The published Linux binaries are statically linked against musl, and until
  # now nothing ran the test suite against them: the matrix above covers glibc
  # and macOS. What Debian and Raspberry Pi users install was never tested.
  #
  # The musl binary runs on the glibc runner, so this is a normal test run with
  # a different target — no emulation, about a minute.
  test-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl

      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test against musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo test --target x86_64-unknown-linux-musl

  # This project started life with internal repository names and ticket ids as
  # test fixtures. The guard keeps them from coming back.
  #
  # The specific names are deliberately NOT listed here — a public workflow
  # naming them would disclose exactly what it is meant to keep out. They live
  # in the FORBIDDEN_PATTERNS repository secret; the shape-based checks below
  # work without it and also run on pull requests from forks.
  no-leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Shape-based: runs on every event, including pull requests from forks.
      # Needs no secret, so there is nothing here a fork could reach for.
      - name: Check for ticket-shaped ids and absolute home paths
        run: |
          paths="src tests README.md CONTRIBUTING.md Cargo.toml build.rs"
          if grep -rnE '\b[A-Z]{2,6}-[0-9]{4,}\b|/Users/[a-z]' $paths; then
            echo "::error::ticket-shaped identifier or absolute home path found"
            exit 1
          fi

      # The project-specific list is a secret because it names the very things
      # being kept out. Restricted to `push` on purpose: the step greps with the
      # pattern and prints what matches, so running it on pull requests would
      # hand an attacker an oracle for recovering the pattern itself.
      - name: Check for project-specific identifiers
        if: github.event_name == 'push'
        env:
          FORBIDDEN: ${{ secrets.FORBIDDEN_PATTERNS }}
        run: |
          paths="src tests README.md CONTRIBUTING.md Cargo.toml build.rs"
          if [ -z "$FORBIDDEN" ]; then
            echo "::warning::FORBIDDEN_PATTERNS is not set — shape checks only"
            exit 0
          fi
          if grep -rniE "$FORBIDDEN" $paths; then
            echo "::error::forbidden identifier found"
            exit 1
          fi
